name: Playback regression checks
on:
  pull_request:
    branches: [dev]
jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock=false --no-audit --no-fund
        env:
          HUSKY: '0'
      - run: npm run type-check
      - run: npm test
      - run: npm run build -- --outDir /tmp/nodelink-build
